<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html>
<head>
  <title>AR Floor Detection</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/three@0.153.0/build/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #arButton {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    webxr="requiredFeatures: hit-test"
    arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Camera entity -->
    <a-entity camera position="0 1.6 0"></a-entity>
    
    <!-- Floor marker (visualized as a semi-transparent plane) -->
    <a-plane
      id="floor-plane"
      material="color: blue; opacity: 0.3"
      rotation="-90 0 0"
      width="4"
      height="4"
      visible="false">
    </a-plane>
  </a-scene>

  <button id="arButton">Start AR</button>

  <script>
    // A-Frame component for AR floor detection
    AFRAME.registerComponent('floor-detector', {
      schema: {
        enabled: { type: 'boolean', default: false }
      },

      init: function () {
        this.scene = this.el.sceneEl;
        this.renderer = this.scene.renderer;
        this.camera = this.scene.camera;
        this.floorPlane = document.getElementById('floor-plane');
        this.xrSession = null;
        this.hitTestSource = null;
        this.threeCamera = null;

        // Bind methods
        this.startAR = this.startAR.bind(this);
        this.onXRFrame = this.onXRFrame.bind(this);

        // Setup AR button
        const arButton = document.getElementById('arButton');
        arButton.addEventListener('click', this.startAR);
      },

      async startAR() {
        if (!navigator.xr) {
          alert('WebXR not supported on this device.');
          return;
        }

        try {
          // Request AR session with hit-test
          this.xrSession = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test']
          });

          // Setup XR session
          this.scene.renderer.xr.enabled = true;
          await this.scene.renderer.xr.setSession(this.xrSession);

          // Get reference space
          const viewerSpace = await this.xrSession.requestReferenceSpace('viewer');
          this.hitTestSource = await this.xrSession.requestHitTestSource({ space: viewerSpace });

          // Setup Three.js camera
          this.threeCamera = this.scene.renderer.xr.getCamera(this.camera);

          // Start animation loop
          this.xrSession.requestAnimationFrame(this.onXRFrame);

          // Update button
          document.getElementById('arButton').style.display = 'none';
        } catch (error) {
          console.error('Error starting AR:', error);
          alert('Failed to start AR session.');
        }
      },

      onXRFrame: function (time, frame) {
        if (!this.xrSession) return;

        // Request next frame
        this.xrSession.requestAnimationFrame(this.onXRFrame);

        const referenceSpace = this.scene.renderer.xr.getReferenceSpace();
        const pose = frame.getViewerPose(referenceSpace);

        if (pose && this.hitTestSource) {
          // Perform hit test
          const hitTestResults = frame.getHitTestResults(this.hitTestSource);

          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const hitPose = hit.getPose(referenceSpace);

            // Check if the hit point is likely a floor (based on normal vector)
            if (hitPose) {
              const position = hitPose.transform.position;
              const orientation = hitPose.transform.orientation;

              // Convert quaternion to Euler for easier normal checking
              const euler = new THREE.Euler().setFromQuaternion(
                new THREE.Quaternion(
                  orientation.x,
                  orientation.y,
                  orientation.z,
                  orientation.w
                )
              );

              // Assume floor has a mostly upward-facing normal (y-axis)
              const normal = new THREE.Vector3(0, 1, 0).applyEuler(euler);
              if (normal.y > 0.8) { // Floor normal threshold
                // Update floor plane position
                this.floorPlane.setAttribute('position', {
                  x: position.x,
                  y: position.y,
                  z: position.z
                });
                this.floorPlane.setAttribute('visible', 'true');
              } else {
                this.floorPlane.setAttribute('visible', 'false');
              }
            }
          } else {
            this.floorPlane.setAttribute('visible', 'false');
          }
        }

        // Render scene
        this.scene.renderer.render(this.scene.object3D, this.threeCamera);
      },

      remove: function () {
        if (this.xrSession) {
          this.xrSession.end();
          this.xrSession = null;
        }
        this.scene.renderer.xr.enabled = false;
      }
    });

    // Initialize floor detector
    document.querySelector('a-scene').setAttribute('floor-detector', 'enabled: true');
  </script>
</body>
</html>
